name: Pubblica dashboard

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/pescaTonnoRosso/pescaTonnoRosso.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # la pagina legge il CSV accanto a sé
      - run: cp data/pescaTonnoRosso/pescaTonnoRosso.csv site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
