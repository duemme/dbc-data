<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tonno rosso, pesca sportiva</title>
  <meta name="description" content="Le catture di tonno rosso della pesca sportiva e ricreativa in Italia, dai dati ufficiali del MASAF ottenuti con accesso civico.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.17/dist/plot.umd.min.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="viz-root">
    <header class="top">
      <div class="top-inner">
        <span class="brand" data-i18n="brand"></span>
        <div class="top-actions">
          <div class="lang" role="group" aria-label="Lingua / Language">
            <button type="button" data-lang="it">IT</button>
            <button type="button" data-lang="en">EN</button>
          </div>
          <a class="donate" id="donate" href="#" target="_blank" rel="noopener" hidden>
            <span aria-hidden="true">♥</span> <span data-i18n="donate"></span>
          </a>
        </div>
      </div>
    </header>

    <main>
      <section class="intro">
        <h1 data-i18n="title"></h1>
        <p class="lede" data-i18n="lede"></p>
      </section>

      <section class="filters" aria-label="Filtri">
        <div class="filter">
          <span class="filter-label" data-i18n="f_years"></span>
          <div class="chips" id="f-years"></div>
        </div>
        <label class="filter">
          <span class="filter-label" data-i18n="f_region"></span>
          <select id="f-region"></select>
        </label>
        <label class="filter">
          <span class="filter-label" data-i18n="f_fao"></span>
          <select id="f-fao"></select>
        </label>
      </section>

      <p class="status" id="status" data-i18n="loading"></p>

      <div id="content" hidden>
        <section class="tiles" id="tiles"></section>

        <section class="card">
          <h2 data-i18n="season_t"></h2>
          <p class="note" data-i18n="season_d"></p>
          <div class="legend" id="season-legend"></div>
          <div class="chart" id="c-season"></div>
        </section>

        <div class="grid2">
          <section class="card">
            <h2 data-i18n="years_count_t"></h2>
            <div class="chart" id="c-years-count"></div>
          </section>
          <section class="card">
            <h2 data-i18n="years_weight_t"></h2>
            <div class="chart" id="c-years-weight"></div>
          </section>
        </div>

        <section class="card">
          <h2 data-i18n="years_table_t"></h2>
          <div class="table-wrap"><table id="t-years"></table></div>
        </section>

        <div class="grid2">
          <section class="card">
            <h2 data-i18n="regions_t"></h2>
            <div class="chart" id="c-regions"></div>
          </section>
          <section class="card">
            <h2 data-i18n="hist_t"></h2>
            <p class="note" data-i18n="hist_d"></p>
            <div class="chart" id="c-hist"></div>
          </section>
        </div>

        <section class="card">
          <h2 data-i18n="heat_t"></h2>
          <p class="note" data-i18n="heat_d"></p>
          <div class="chart" id="c-heat"></div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 data-i18n="data_t"></h2>
            <button type="button" class="btn" id="download" data-i18n="download"></button>
          </div>
          <div class="table-wrap"><table id="t-rows"></table></div>
          <button type="button" class="btn ghost" id="more" data-i18n="more"></button>
        </section>

        <section class="about">
          <h2 data-i18n="about_t"></h2>
          <ul>
            <li data-i18n="about_src"></li>
            <li data-i18n="about_ids"></li>
            <li data-i18n="about_fix"></li>
            <li data-i18n="about_repo"></li>
          </ul>
        </section>
      </div>
    </main>

    <footer class="foot">
      <p data-i18n="footer"></p>
    </footer>
  </div>
</body>
</html>
